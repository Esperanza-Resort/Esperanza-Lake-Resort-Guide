<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Esperanza Lake Resort</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap');
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                  url('esperanzabackround.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      -webkit-tap-highlight-color: transparent;
    }
    .mobile-mode {
      background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                  url('backgroundmobile.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    header {
      margin-top: 60px;
      background: linear-gradient(135deg, rgba(25,15,10,0.85), rgba(50,30,20,0.7));
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 22px 100px;
      border-radius: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      text-align: center;
      opacity: 0;
      transform: translateY(-50px);
    }
    header img {
      max-width: 300px;
      height: auto;
      opacity: 0;
      transform: scale(0.8);
    }
    .pdf-list {
      margin-top: 50px;
      width: 85%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      transform: translateY(20px);
    }
    .pdf-item {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border-radius: 14px;
      padding: 14px 20px;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      color: #fff;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      text-align: center;
      text-decoration: none;
      opacity: 0;
      transform: translate3d(-30px, 0, 0);
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      will-change: transform, box-shadow;
      position: relative;
      overflow: hidden;
      user-select: none;
    }
    .pdf-item::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(15px) saturate(160%);
      -webkit-backdrop-filter: blur(15px) saturate(160%);
      z-index: -1;
      pointer-events: none;
      border-radius: 20px;
      transition: background 0.25s ease;
    }
    .pdf-item:active {
      transform: scale(0.97);
    }
    .pdf-item:hover {
      transform: scale(1.02) translate3d(0, -3px, 0);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    .pdf-item:hover::before {
      background: rgba(255,255,255,0.22);
    }
    /* --- Modal --- */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: fadeIn 0.5s ease forwards;
      overflow: hidden;
    }
    #overlay.closing {
      animation: fadeOut 0.5s ease forwards;
    }
    #pdf-modal {
      width: 96%;
      max-width: 950px;
      height: 92vh;
      background: linear-gradient(135deg, rgba(30,20,10,0.9), rgba(50,30,20,0.8));
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 12px 50px rgba(0,0,0,0.5);
      position: relative;
      transform: scale(0.85);
      opacity: 0;
      animation: modalPop 0.55s ease forwards;
      border: 1px solid rgba(255,255,255,0.18);
    }
    #pdf-modal.closing {
      animation: modalPopOut 0.5s ease forwards;
    }
    #pdf-title {
      background: rgba(255,255,255,0.1);
      color: #fff;
      padding: 14px 20px;
      font-size: 1.15rem;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    #pdf-viewer {
      width: 100%;
      height: calc(100% - 52px);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(255,255,255,0.18);
      color: #fff;
      border: none;
      font-size: 1.3rem;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    #close-btn:active {
      background: rgba(255,255,255,0.35);
      transform: scale(0.92);
    }
    /* --- Mobile --- */
    .mobile-mode header {
      margin-top: 28px;
      width: 88%;
      max-width: 320px;
      padding: 14px 18px;
    }
    .mobile-mode header img {
      max-width: 210px;
    }
    .mobile-mode .pdf-list {
      margin-top: 36px;
      width: 90%;
      gap: 12px;
    }
    .mobile-mode .pdf-item {
      font-size: 1.05rem;
      padding: 13px 18px;
      border-radius: 14px;
    }
    @keyframes fadeInBackground {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideInFromTop {
      from { opacity: 0; transform: translateY(-50px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInFromLeft {
      from { opacity: 0; transform: translate3d(-30px, 0, 0); }
      to { opacity: 1; transform: translate3d(0, 0, 0); }
    }
    @keyframes modalPop {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes modalPopOut {
      from { transform: scale(1); opacity: 1; }
      to { transform: scale(0.85); opacity: 0; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    @media (max-width: 600px) {
      header {
        margin-top: 28px;
        width: 88%;
        max-width: 320px;
        padding: 14px 18px;
      }
      header img {
        max-width: 210px;
      }
      .pdf-list {
        margin-top: 36px;
        width: 90%;
        gap: 12px;
      }
      .pdf-item {
        font-size: 1.05rem;
        padding: 13px 18px;
        border-radius: 14px;
      }
      #pdf-modal {
        width: 100%;
        height: 100%;
        border-radius: 0;
        max-width: none;
      }
      #pdf-title {
        font-size: 1.05rem;
        padding: 16px 18px;
        padding-right: 60px;
      }
      #close-btn {
        width: 48px;
        height: 48px;
        top: 12px;
        right: 12px;
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="logo2.png" alt="">
  </header>
  <div class="pdf-list">
    <!-- Pakeisti į /preview linkus -->
    <a class="pdf-item" href="https://drive.google.com/file/d/1a_As-DNlEiftrXvqc7ZdlmB2Lg7JchyN/preview" target="_blank" rel="noopener noreferrer">
      ESPERANZA FESTIVE VIDEO
    </a>
    <a class="pdf-item" href="https://drive.google.com/file/d/1sBk7ABJhNpwS-W-PilVQz-nlG14vHY26/preview" target="_blank" rel="noopener noreferrer">
      ESPERANZA FESTIVE VIDEO 2
    </a>
    <a class="pdf-item" href="Esperanza Festive Brochure.pdf" onclick="openPDF(event, 'Esperanza Festive Brochure.pdf', 'FESTIVE BROCHURE')">
      ESPERANZA FESTIVE BROCHURE
    </a>
  </div>
  <div id="overlay">
    <div id="pdf-modal">
      <div id="pdf-title"></div>
      <button id="close-btn" onclick="closePDF()">✖</button>
      <div id="pdf-viewer"></div>
    </div>
  </div>
  <script>
    const overlay = document.getElementById('overlay');
    const viewer = document.getElementById('pdf-viewer');
    const pdfTitle = document.getElementById('pdf-title');
    const pdfModal = document.getElementById('pdf-modal');

    function isMobile() {
      return window.innerWidth <= 600 || document.body.classList.contains('mobile-mode');
    }

    function loadViewer(file) {
      viewer.innerHTML = '';
      const old = viewer.querySelector('iframe');
      if (old) {
        old.src = '';
        old.remove();
      }
      const iframe = document.createElement('iframe');
      iframe.src = file + '?_=' + Date.now() + '#toolbar=0&navpanes=0&scrollbar=0&page=1';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      iframe.setAttribute('allowfullscreen', '');
      viewer.appendChild(iframe);
    }

    function openPDF(event, file, title) {
      if (isMobile()) {
        return; // mobilėje tiesiog atidaro PDF
      }
      event.preventDefault();
      overlay.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      loadViewer(file);
      pdfTitle.textContent = title;
      overlay.classList.remove('closing');
      pdfModal.classList.remove('closing');
    }

    function closePDF() {
      overlay.classList.add('closing');
      pdfModal.classList.add('closing');
      setTimeout(() => {
        overlay.style.display = 'none';
        const old = viewer.querySelector('iframe');
        if (old) {
          old.src = '';
          old.remove();
        }
        viewer.innerHTML = '';
        pdfTitle.textContent = '';
        document.body.style.overflow = 'auto';
        overlay.classList.remove('closing');
        pdfModal.classList.remove('closing');
      }, 500);
    }

    overlay.addEventListener('click', e => {
      if (e.target === overlay) closePDF();
    });

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && overlay.style.display === 'flex') {
        closePDF();
      }
    });

    window.addEventListener('load', function() {
      if (window.innerWidth <= 600) {
        document.body.classList.add('mobile-mode');
      }
      document.body.style.animation = 'fadeInBackground 1.4s ease forwards';
      setTimeout(() => {
        document.querySelector('header').style.animation = 'slideInFromTop 1.1s ease forwards';
      }, 80);
      setTimeout(() => {
        document.querySelector('header img').style.animation = 'zoomIn 1.3s ease forwards';
      }, 350);
      setTimeout(() => {
        document.querySelector('.pdf-list').style.animation = 'fadeInUp 1.1s ease forwards';
      }, 650);
      setTimeout(() => {
        document.querySelectorAll('.pdf-item').forEach((item, index) => {
          setTimeout(() => {
            item.style.animation = 'slideInFromLeft 0.7s ease forwards';
          }, index * 110);
        });
      }, 900);
    });

    window.addEventListener('resize', () => {
      if (window.innerWidth <= 600) {
        document.body.classList.add('mobile-mode');
      } else {
        document.body.classList.remove('mobile-mode');
      }
    });
  </script>
</body>
</html>
