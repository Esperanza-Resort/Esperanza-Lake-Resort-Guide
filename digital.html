<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <title>Aleksandar Simonovic | Esperanza Lake Resort</title>

    <meta
        name="description"
        content="Digital Business Card - Aleksandar Simonovic, Guest Relations, Esperanza Lake Resort"
    >


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(201, 185, 138, 0.10),
                    transparent 38%
                ),
                #080808;

            color: #ffffff;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;

        }


        /* =====================================================
           MAIN CARD
        ===================================================== */

        .card {

            width: 100%;

            max-width: 440px;

            background:
                #141414;

            border:
                1px solid rgba(255, 255, 255, 0.10);

            border-radius:
                28px;

            overflow:
                hidden;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.65),
                0 0 0 1px rgba(255, 255, 255, 0.02);

            animation:
                cardAppear 0.7s ease;

        }


        /* =====================================================
           CARD ANIMATION
        ===================================================== */

        @keyframes cardAppear {

            from {

                opacity:
                    0;

                transform:
                    translateY(25px);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);

            }

        }


        /* =====================================================
           COVER
        ===================================================== */

        .cover {

            height:
                190px;

            position:
                relative;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            overflow:
                hidden;

            background-image:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.20),
                    rgba(0, 0, 0, 0.72)
                ),
                url("./background.jpg");

            background-position:
                center center;

            background-size:
                cover;

            background-repeat:
                no-repeat;

        }


        /* =====================================================
           GOLD GLOW
        ===================================================== */

        .cover-glow {

            position:
                absolute;

            width:
                260px;

            height:
                260px;

            left:
                50%;

            top:
                50%;

            transform:
                translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(201, 185, 138, 0.18),
                    transparent 68%
                );

            z-index:
                2;

            pointer-events:
                none;

        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            position:
                relative;

            z-index:
                10;

            display:
                block;

            width:
                180px;

            height:
                auto;

            max-height:
                90px;

            object-fit:
                contain;

            opacity:
                1;

            filter:
                drop-shadow(
                    0 5px 15px
                    rgba(0, 0, 0, 0.75)
                );

        }


        /* =====================================================
           GOLD LINE
        ===================================================== */

        .cover-line {

            position:
                absolute;

            z-index:
                20;

            bottom:
                0;

            left:
                50%;

            transform:
                translateX(-50%);

            width:
                65px;

            height:
                2px;

            background:
                #c9b98a;

            opacity:
                0.9;

        }


        /* =====================================================
           PROFILE
        ===================================================== */

        .profile {

            text-align:
                center;

            padding:
                28px 25px 18px;

        }


        /* =====================================================
           PROFILE PHOTO
        ===================================================== */

        .avatar {

            width:
                96px;

            height:
                96px;

            margin:
                0 auto 18px;

            border-radius:
                50%;

            border:
                3px solid #c9b98a;

            background-color:
                #252525;

            background-image:
                url("./profile.jpg");

            background-position:
                center;

            background-size:
                cover;

            background-repeat:
                no-repeat;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.55);

        }


        /* =====================================================
           NAME
        ===================================================== */

        .name {

            font-size:
                27px;

            line-height:
                1.2;

            font-weight:
                600;

            letter-spacing:
                -0.5px;

            color:
                #ffffff;

        }


        /* =====================================================
           POSITION
        ===================================================== */

        .position {

            margin-top:
                8px;

            color:
                #c9b98a;

            font-size:
                13px;

            font-weight:
                600;

            letter-spacing:
                1.6px;

            text-transform:
                uppercase;

        }


        /* =====================================================
           COMPANY
        ===================================================== */

        .company {

            margin-top:
                8px;

            color:
                #9d9d9d;

            font-size:
                14px;

        }


        /* =====================================================
           DIVIDER
        ===================================================== */

        .divider {

            width:
                45px;

            height:
                1px;

            background:
                #c9b98a;

            margin:
                22px auto 4px;

            opacity:
                0.75;

        }


        /* =====================================================
           CONTACT BUTTONS
        ===================================================== */

        .actions {

            display:
                grid;

            gap:
                11px;

            padding:
                0 25px;

        }


        .action {

            display:
                flex;

            align-items:
                center;

            text-decoration:
                none;

            color:
                #ffffff;

            background:
                rgba(255, 255, 255, 0.045);

            border:
                1px solid
                rgba(255, 255, 255, 0.075);

            border-radius:
                15px;

            padding:
                14px 16px;

            transition:
                all 0.25s ease;

        }


        .action:hover {

            background:
                rgba(255, 255, 255, 0.09);

            border-color:
                rgba(201, 185, 138, 0.50);

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.20);

        }


        /* =====================================================
           ICON
        ===================================================== */

        .icon {

            width:
                42px;

            height:
                42px;

            min-width:
                42px;

            border-radius:
                12px;

            background:
                rgba(201, 185, 138, 0.10);

            border:
                1px solid
                rgba(201, 185, 138, 0.12);

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            margin-right:
                13px;

            font-size:
                18px;

        }


        /* =====================================================
           CONTACT TEXT
        ===================================================== */

        .action-text {

            display:
                flex;

            flex-direction:
                column;

            text-align:
                left;

            min-width:
                0;

        }


        .action-label {

            font-size:
                10px;

            color:
                #777777;

            margin-bottom:
                3px;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

        }


        .action-value {

            font-size:
                14px;

            color:
                #eeeeee;

            word-break:
                break-word;

        }


        /* =====================================================
           MAIN ACTION BUTTONS
        ===================================================== */

        .main-actions {

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                11px;

            padding:
                22px 25px 0;

        }


        .main-button {

            border:
                none;

            border-radius:
                15px;

            padding:
                15px 10px;

            font-size:
                13px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                all 0.25s ease;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                7px;

        }


        /* =====================================================
           SAVE BUTTON
        ===================================================== */

        .save-button {

            background:
                linear-gradient(
                    135deg,
                    #dac68f,
                    #a9925d
                );

            color:
                #111111;

            box-shadow:
                0 8px 25px
                rgba(201, 185, 138, 0.16);

        }


        .save-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 30px
                rgba(201, 185, 138, 0.30);

        }


        /* =====================================================
           SHARE BUTTON
        ===================================================== */

        .share-button {

            background:
                rgba(255, 255, 255, 0.06);

            color:
                #ffffff;

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

        }


        .share-button:hover {

            transform:
                translateY(-2px);

            background:
                rgba(255, 255, 255, 0.10);

            border-color:
                rgba(201, 185, 138, 0.45);

        }


        /* =====================================================
           QR BUTTON
        ===================================================== */

        .qr-button-wrapper {

            padding:
                11px 25px 0;

        }


        .qr-button {

            width:
                100%;

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius:
                15px;

            padding:
                14px;

            background:
                rgba(255, 255, 255, 0.035);

            color:
                #cccccc;

            font-size:
                13px;

            font-weight:
                600;

            cursor:
                pointer;

            transition:
                all 0.25s ease;

        }


        .qr-button:hover {

            background:
                rgba(255, 255, 255, 0.08);

            border-color:
                rgba(201, 185, 138, 0.40);

            color:
                #ffffff;

        }


        /* =====================================================
           QR MODAL
        ===================================================== */

        .qr-modal {

            position:
                fixed;

            inset:
                0;

            background:
                rgba(0, 0, 0, 0.82);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            display:
                none;

            justify-content:
                center;

            align-items:
                center;

            padding:
                20px;

            z-index:
                9999;

        }


        .qr-modal.active {

            display:
                flex;

        }


        /* =====================================================
           QR MODAL CONTENT
        ===================================================== */

        .qr-modal-content {

            width:
                100%;

            max-width:
                350px;

            background:
                #151515;

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius:
                25px;

            padding:
                30px 25px;

            text-align:
                center;

            position:
                relative;

            box-shadow:
                0 30px 80px
                rgba(0, 0, 0, 0.70);

            animation:
                modalAppear 0.25s ease;

        }


        @keyframes modalAppear {

            from {

                opacity:
                    0;

                transform:
                    scale(0.94);

            }

            to {

                opacity:
                    1;

                transform:
                    scale(1);

            }

        }


        /* =====================================================
           QR CLOSE BUTTON
        ===================================================== */

        .qr-close {

            position:
                absolute;

            top:
                12px;

            right:
                12px;

            width:
                35px;

            height:
                35px;

            border:
                none;

            border-radius:
                50%;

            background:
                rgba(255, 255, 255, 0.08);

            color:
                #ffffff;

            font-size:
                20px;

            cursor:
                pointer;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

        }


        /* =====================================================
           QR TITLE
        ===================================================== */

        .qr-modal-title {

            font-size:
                21px;

            font-weight:
                600;

            margin-bottom:
                8px;

        }


        .qr-modal-subtitle {

            color:
                #8f8f8f;

            font-size:
                13px;

            line-height:
                1.5;

            margin-bottom:
                22px;

        }


        /* =====================================================
           QR CODE
        ===================================================== */

        #qrcode {

            display:
                inline-block;

            padding:
                12px;

            background:
                #ffffff;

            border-radius:
                16px;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.40);

        }


        #qrcode img {

            display:
                block;

        }


        /* =====================================================
           SAVE MESSAGE
        ===================================================== */

        .save-message {

            text-align:
                center;

            color:
                #a8a8a8;

            font-size:
                12px;

            line-height:
                1.5;

            margin:
                12px 25px 0;

            display:
                none;

        }


        .save-message.show {

            display:
                block;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            text-align:
                center;

            padding:
                25px;

            color:
                #555555;

            font-size:
                10px;

            letter-spacing:
                0.8px;

            text-transform:
                uppercase;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 420px) {

            body {

                padding:
                    12px;

            }


            .card {

                border-radius:
                    22px;

            }


            .cover {

                height:
                    165px;

            }


            .logo {

                width:
                    155px;

                max-height:
                    75px;

            }


            .name {

                font-size:
                    24px;

            }


            .position {

                font-size:
                    11px;

                letter-spacing:
                    1.3px;

            }


            .main-button {

                font-size:
                    12px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BUSINESS CARD
    ===================================================== -->

    <div class="card">


        <!-- =================================================
             COVER
        ================================================== -->

        <div class="cover">

            <div class="cover-glow"></div>

            <img
                src="./logo.png"
                class="logo"
                alt="Esperanza Lake Resort Logo"
            >

            <div class="cover-line"></div>

        </div>



        <!-- =================================================
             PROFILE
        ================================================== -->

        <div class="profile">

            <div class="avatar"></div>

            <div class="name">
                Aleksandar Simonovic
            </div>

            <div class="position">
                Guest Relations Manager
            </div>

            <div class="company">
                Esperanza Lake Resort
            </div>

            <div class="divider"></div>

        </div>



        <!-- =================================================
             CONTACT INFORMATION
        ================================================== -->

        <div class="actions">


            <!-- PHONE -->

            <a
                class="action"
                href="tel:+37060000000"
            >

                <div class="icon">
                    📞
                </div>

                <div class="action-text">

                    <span class="action-label">
                        Phone
                    </span>

                    <span class="action-value">
                        +370 600 00000
                    </span>

                </div>

            </a>



            <!-- WEBSITE -->

            <a
                class="action"
                href="https://www.esperanzaresort.lt"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="icon">
                    🌐
                </div>

                <div class="action-text">

                    <span class="action-label">
                        Website
                    </span>

                    <span class="action-value">
                        www.esperanzaresort.lt
                    </span>

                </div>

            </a>



            <!-- LOCATION -->

            <a
                class="action"
                href="https://maps.google.com/?q=Esperanza+Lake+Resort"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="icon">
                    📍
                </div>

                <div class="action-text">

                    <span class="action-label">
                        Location
                    </span>

                    <span class="action-value">
                        Esperanza Lake Resort
                    </span>

                </div>

            </a>


        </div>



        <!-- =================================================
             MAIN BUTTONS
        ================================================== -->

        <div class="main-actions">


            <!-- SAVE CONTACT -->

            <button
                type="button"
                class="main-button save-button"
                onclick="saveContact()"
            >

                ＋ Save Contact

            </button>



            <!-- SHARE -->

            <button
                type="button"
                class="main-button share-button"
                onclick="shareContact()"
            >

                ↗ Share Contact

            </button>


        </div>



        <!-- =================================================
             QR BUTTON
        ================================================== -->

        <div class="qr-button-wrapper">

            <button
                type="button"
                class="qr-button"
                onclick="openQR()"
            >

                ▣ &nbsp; Show QR Code

            </button>

        </div>



        <!-- =================================================
             MESSAGE
        ================================================== -->

        <div
            id="saveMessage"
            class="save-message"
        ></div>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="footer">

            Esperanza Hospitality Group

        </div>


    </div>



    <!-- =====================================================
         QR MODAL
    ===================================================== -->

    <div
        id="qrModal"
        class="qr-modal"
        onclick="closeQR(event)"
    >

        <div
            class="qr-modal-content"
            onclick="event.stopPropagation()"
        >


            <button
                type="button"
                class="qr-close"
                onclick="closeQR()"
            >
                ×
            </button>


            <div class="qr-modal-title">

                Scan QR Code

            </div>


            <div class="qr-modal-subtitle">

                Scan this QR code with your phone
                to open the digital business card.

            </div>


            <div id="qrcode"></div>


        </div>

    </div>



    <!-- =====================================================
         QR CODE LIBRARY
    ===================================================== -->

    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js">
    </script>



    <script>


        /* =====================================================
           CONTACT INFORMATION
        ===================================================== */

        const contact = {

            firstName:
                "Aleksandar",

            lastName:
                "Simonovic",

            jobTitle:
                "Guest Relations Manager",

            company:
                "Esperanza Lake Resort",

            phone:
                "+37060000000",

            website:
                "https://www.esperanzaresort.lt",

            address:
                "Esperanza Lake Resort, Lithuania"

        };



        /* =====================================================
           CREATE VCARD
        ===================================================== */

        function createVCard() {

            return `BEGIN:VCARD
VERSION:3.0
N:${contact.lastName};${contact.firstName};;;
FN:${contact.firstName} ${contact.lastName}
ORG:${contact.company}
TITLE:${contact.jobTitle}
TEL;TYPE=CELL:${contact.phone}
URL:${contact.website}
ADR;TYPE=WORK:;;${contact.address};;;
END:VCARD`;

        }



        /* =====================================================
           SHOW MESSAGE
        ===================================================== */

        function showMessage(text) {

            const message =
                document.getElementById(
                    "saveMessage"
                );


            message.textContent =
                text;


            message.classList.add(
                "show"
            );


            setTimeout(
                function () {

                    message.classList.remove(
                        "show"
                    );

                },
                6000
            );

        }



        /* =====================================================
           SAVE CONTACT
        ===================================================== */

        async function saveContact() {


            const vCard =
                createVCard();


            /*
             * Create .vcf file
             */

            const blob =
                new Blob(
                    [vCard],
                    {
                        type:
                            "text/vcard;charset=utf-8"
                    }
                );


            const file =
                new File(
                    [blob],
                    "Aleksandar_Simonovic.vcf",
                    {
                        type:
                            "text/vcard"
                    }
                );


            /*
             * First try the modern
             * iPhone / Android Share API.
             */

            if (
                navigator.share &&
                navigator.canShare
            ) {

                try {

                    if (
                        navigator.canShare({
                            files: [file]
                        })
                    ) {

                        await navigator.share({

                            files:
                                [file],

                            title:
                                "Save Contact",

                            text:
                                "Aleksandar Simonovic - Esperanza Lake Resort"

                        });

                        return;

                    }

                }

                catch (error) {

                    /*
                     * User cancelled Share window.
                     * Do nothing.
                     */

                    if (
                        error.name ===
                        "AbortError"
                    ) {

                        return;

                    }

                }

            }



            /*
             * Fallback:
             * create downloadable VCF file.
             */

            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                "Aleksandar_Simonovic.vcf";


            link.style.display =
                "none";


            document.body.appendChild(
                link
            );


            link.click();


            document.body.removeChild(
                link
            );


            setTimeout(
                function () {

                    URL.revokeObjectURL(
                        url
                    );

                },
                1000
            );


            showMessage(
                "The contact file has been prepared. Open it and choose Add to Contacts."
            );

        }



        /* =====================================================
           SHARE CONTACT
        ===================================================== */

        async function shareContact() {


            const shareData = {

                title:
                    "Aleksandar Simonovic",

                text:
                    "Aleksandar Simonovic - Guest Relations Manager, Esperanza Lake Resort",

                url:
                    window.location.href

            };


            /*
             * Native iPhone / Android Share
             */

            if (
                navigator.share
            ) {

                try {

                    await navigator.share(
                        shareData
                    );

                }

                catch (error) {

                    /*
                     * User cancelled.
                     */

                    if (
                        error.name !==
                        "AbortError"
                    ) {

                        console.log(
                            error
                        );

                    }

                }

            }

            else {

                /*
                 * Browser doesn't support
                 * native sharing.
                 */

                showMessage(
                    "Sharing is not supported by this browser."
                );

            }

        }



        /* =====================================================
           OPEN QR CODE
        ===================================================== */

        function openQR() {


            const modal =
                document.getElementById(
                    "qrModal"
                );


            modal.classList.add(
                "active"
            );


            /*
             * Generate QR only once.
             */

            const qrContainer =
                document.getElementById(
                    "qrcode"
                );


            if (
                qrContainer.innerHTML.trim() === ""
            ) {

                if (
                    typeof QRCode !==
                    "undefined"
                ) {

                    new QRCode(

                        qrContainer,

                        {

                            text:
                                window.location.href,

                            width:
                                200,

                            height:
                                200,

                            colorDark:
                                "#111111",

                            colorLight:
                                "#ffffff",

                            correctLevel:
                                QRCode.CorrectLevel.H

                        }

                    );

                }

            }

        }



        /* =====================================================
           CLOSE QR CODE
        ===================================================== */

        function closeQR(event) {


            /*
             * If clicked outside modal,
             * close it.
             */

            if (
                event &&
                event.target !==
                event.currentTarget
            ) {

                return;

            }


            const modal =
                document.getElementById(
                    "qrModal"
                );


            modal.classList.remove(
                "active"
            );

        }



        /* =====================================================
           ESC KEY CLOSES QR
        ===================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeQR();

                }

            }
        );


    </script>
