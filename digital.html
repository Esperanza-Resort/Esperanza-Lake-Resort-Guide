<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#080808"
    >

    <title>Aleksandar Simonovic | Esperanza Lake Resort</title>

    <meta
        name="description"
        content="Digital Business Card - Aleksandar Simonovic, Guest Relations, Esperanza Lake Resort"
    >


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
        ===================================================== */

        body {

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(201, 185, 138, 0.10),
                    transparent 38%
                ),
                #080808;

            color:
                #ffffff;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            padding:
                20px;

        }


        /* =====================================================
           MAIN CARD
        ===================================================== */

        .card {

            width:
                100%;

            max-width:
                440px;

            background:
                #141414;

            border:
                1px solid rgba(255, 255, 255, 0.10);

            border-radius:
                28px;

            overflow:
                hidden;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.65),
                0 0 0 1px rgba(255, 255, 255, 0.02);

            animation:
                cardAppear 0.7s ease;

        }


        /* =====================================================
           CARD ANIMATION
        ===================================================== */

        @keyframes cardAppear {

            from {

                opacity:
                    0;

                transform:
                    translateY(25px);

            }

            to {

                opacity:
                    1;

                transform:
                    translateY(0);

            }

        }


        /* =====================================================
           COVER
        ===================================================== */

        .cover {

            height:
                190px;

            position:
                relative;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            overflow:
                hidden;

            background-image:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.20),
                    rgba(0, 0, 0, 0.72)
                ),
                url("./background.jpg");

            background-position:
                center center;

            background-size:
                cover;

            background-repeat:
                no-repeat;

        }


        /* =====================================================
           GOLD GLOW
        ===================================================== */

        .cover-glow {

            position:
                absolute;

            width:
                260px;

            height:
                260px;

            left:
                50%;

            top:
                50%;

            transform:
                translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(201, 185, 138, 0.18),
                    transparent 68%
                );

            z-index:
                2;

            pointer-events:
                none;

        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo {

            position:
                relative;

            z-index:
                10;

            display:
                block;

            width:
                180px;

            height:
                auto;

            max-height:
                90px;

            object-fit:
                contain;

            filter:
                drop-shadow(
                    0 5px 15px
                    rgba(0, 0, 0, 0.75)
                );

        }


        /* =====================================================
           GOLD LINE
        ===================================================== */

        .cover-line {

            position:
                absolute;

            z-index:
                20;

            bottom:
                0;

            left:
                50%;

            transform:
                translateX(-50%);

            width:
                65px;

            height:
                2px;

            background:
                #c9b98a;

            opacity:
                0.9;

        }


        /* =====================================================
           PROFILE
        ===================================================== */

        .profile {

            text-align:
                center;

            padding:
                28px 25px 18px;

        }


        /* =====================================================
           PROFILE PHOTO
        ===================================================== */

        .avatar {

            width:
                96px;

            height:
                96px;

            margin:
                0 auto 18px;

            border-radius:
                50%;

            border:
                3px solid #c9b98a;

            background-color:
                #252525;

            background-image:
                url("./profile.jpg");

            background-position:
                center;

            background-size:
                cover;

            background-repeat:
                no-repeat;

            box-shadow:
                0 12px 35px
                rgba(0, 0, 0, 0.55);

        }


        /* =====================================================
           NAME
        ===================================================== */

        .name {

            font-size:
                27px;

            line-height:
                1.2;

            font-weight:
                600;

            letter-spacing:
                -0.5px;

            color:
                #ffffff;

        }


        /* =====================================================
           POSITION
        ===================================================== */

        .position {

            margin-top:
                8px;

            color:
                #c9b98a;

            font-size:
                13px;

            font-weight:
                600;

            letter-spacing:
                1.6px;

            text-transform:
                uppercase;

        }


        /* =====================================================
           COMPANY
        ===================================================== */

        .company {

            margin-top:
                8px;

            color:
                #9d9d9d;

            font-size:
                14px;

        }


        /* =====================================================
           DIVIDER
        ===================================================== */

        .divider {

            width:
                45px;

            height:
                1px;

            background:
                #c9b98a;

            margin:
                22px auto 4px;

            opacity:
                0.75;

        }


        /* =====================================================
           CONTACT BUTTONS
        ===================================================== */

        .actions {

            display:
                grid;

            gap:
                11px;

            padding:
                0 25px;

        }


        .action {

            display:
                flex;

            align-items:
                center;

            text-decoration:
                none;

            color:
                #ffffff;

            background:
                rgba(255, 255, 255, 0.045);

            border:
                1px solid
                rgba(255, 255, 255, 0.075);

            border-radius:
                15px;

            padding:
                14px 16px;

            transition:
                all 0.25s ease;

        }


        .action:hover {

            background:
                rgba(255, 255, 255, 0.09);

            border-color:
                rgba(201, 185, 138, 0.50);

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 25px
                rgba(0, 0, 0, 0.20);

        }


        /* =====================================================
           ICON
        ===================================================== */

        .icon {

            width:
                42px;

            height:
                42px;

            min-width:
                42px;

            border-radius:
                12px;

            background:
                rgba(201, 185, 138, 0.10);

            border:
                1px solid
                rgba(201, 185, 138, 0.15);

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            margin-right:
                13px;

        }


        .icon svg {

            width:
                19px;

            height:
                19px;

            stroke:
                #c9b98a;

            stroke-width:
                1.7;

            fill:
                none;

            stroke-linecap:
                round;

            stroke-linejoin:
                round;

        }


        /* =====================================================
           CONTACT TEXT
        ===================================================== */

        .action-text {

            display:
                flex;

            flex-direction:
                column;

            text-align:
                left;

            min-width:
                0;

        }


        .action-label {

            font-size:
                10px;

            color:
                #777777;

            margin-bottom:
                3px;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

        }


        .action-value {

            font-size:
                14px;

            color:
                #eeeeee;

            word-break:
                break-word;

        }


        /* =====================================================
           SHARE BUTTON
        ===================================================== */

        .share-button {

            margin:
                22px 25px 0;

            width:
                calc(100% - 50px);

            border:
                none;

            border-radius:
                15px;

            padding:
                16px;

            background:
                linear-gradient(
                    135deg,
                    #dac68f,
                    #a9925d
                );

            color:
                #111111;

            font-size:
                15px;

            font-weight:
                700;

            cursor:
                pointer;

            transition:
                all 0.25s ease;

            box-shadow:
                0 8px 25px
                rgba(201, 185, 138, 0.16);

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                9px;

        }


        .share-button svg {

            width:
                18px;

            height:
                18px;

            stroke:
                #111111;

            stroke-width:
                2;

            fill:
                none;

            stroke-linecap:
                round;

            stroke-linejoin:
                round;

        }


        .share-button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 12px 30px
                rgba(201, 185, 138, 0.30);

        }


        .share-button:active {

            transform:
                translateY(0);

        }


        /* =====================================================
           QR BUTTON
        ===================================================== */

        .qr-button-wrapper {

            padding:
                11px 25px 0;

        }


        .qr-button {

            width:
                100%;

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius:
                15px;

            padding:
                14px;

            background:
                rgba(255, 255, 255, 0.035);

            color:
                #cccccc;

            font-size:
                13px;

            font-weight:
                600;

            cursor:
                pointer;

            transition:
                all 0.25s ease;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

            gap:
                8px;

        }


        .qr-button svg {

            width:
                17px;

            height:
                17px;

            stroke:
                #c9b98a;

            stroke-width:
                1.7;

            fill:
                none;

            stroke-linecap:
                round;

            stroke-linejoin:
                round;

        }


        .qr-button:hover {

            background:
                rgba(255, 255, 255, 0.08);

            border-color:
                rgba(201, 185, 138, 0.40);

            color:
                #ffffff;

        }


        /* =====================================================
           QR MODAL
        ===================================================== */

        .qr-modal {

            position:
                fixed;

            inset:
                0;

            background:
                rgba(0, 0, 0, 0.82);

            backdrop-filter:
                blur(8px);

            -webkit-backdrop-filter:
                blur(8px);

            display:
                none;

            justify-content:
                center;

            align-items:
                center;

            padding:
                20px;

            z-index:
                9999;

        }


        .qr-modal.active {

            display:
                flex;

        }


        /* =====================================================
           QR MODAL CONTENT
        ===================================================== */

        .qr-modal-content {

            width:
                100%;

            max-width:
                350px;

            background:
                #151515;

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius:
                25px;

            padding:
                30px 25px;

            text-align:
                center;

            position:
                relative;

            box-shadow:
                0 30px 80px
                rgba(0, 0, 0, 0.70);

            animation:
                modalAppear 0.25s ease;

        }


        @keyframes modalAppear {

            from {

                opacity:
                    0;

                transform:
                    scale(0.94);

            }

            to {

                opacity:
                    1;

                transform:
                    scale(1);

            }

        }


        /* =====================================================
           QR CLOSE
        ===================================================== */

        .qr-close {

            position:
                absolute;

            top:
                12px;

            right:
                12px;

            width:
                35px;

            height:
                35px;

            border:
                none;

            border-radius:
                50%;

            background:
                rgba(255, 255, 255, 0.08);

            color:
                #ffffff;

            font-size:
                20px;

            cursor:
                pointer;

            display:
                flex;

            justify-content:
                center;

            align-items:
                center;

        }


        /* =====================================================
           QR TITLE
        ===================================================== */

        .qr-modal-title {

            font-size:
                21px;

            font-weight:
                600;

            margin-bottom:
                8px;

        }


        .qr-modal-subtitle {

            color:
                #8f8f8f;

            font-size:
                13px;

            line-height:
                1.5;

            margin-bottom:
                22px;

        }


        /* =====================================================
           QR IMAGE
        ===================================================== */

        .qr-image {

            width:
                220px;

            height:
                220px;

            object-fit:
                contain;

            display:
                block;

            margin:
                0 auto;

            background:
                #ffffff;

            padding:
                10px;

            border-radius:
                16px;

        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .footer {

            text-align:
                center;

            padding:
                25px;

            color:
                #555555;

            font-size:
                10px;

            letter-spacing:
                0.8px;

            text-transform:
                uppercase;

        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 420px) {

            body {

                padding:
                    12px;

            }


            .card {

                border-radius:
                    22px;

            }


            .cover {

                height:
                    165px;

            }


            .logo {

                width:
                    155px;

                max-height:
                    75px;

            }


            .name {

                font-size:
                    24px;

            }


            .position {

                font-size:
                    11px;

                letter-spacing:
                    1.3px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         BUSINESS CARD
    ===================================================== -->

    <div class="card">


        <!-- =================================================
             COVER
        ================================================== -->

        <div class="cover">

            <div class="cover-glow"></div>


            <img
                src="./logo.png"
                class="logo"
                alt="Esperanza Lake Resort Logo"
            >


            <div class="cover-line"></div>

        </div>



        <!-- =================================================
             PROFILE
        ================================================== -->

        <div class="profile">


            <div class="avatar"></div>


            <div class="name">
                Aleksandar Simanovic
            </div>


            <div class="position">
                Guest Relations
            </div>


            <div class="company">
                Esperanza Lake Resort
            </div>


            <div class="divider"></div>


        </div>



        <!-- =================================================
             CONTACT INFORMATION
        ================================================= -->

        <div class="actions">


            <!-- =================================================
                 PHONE
            ================================================= -->

            <a
                class="action"
                href="tel:+37060000000"
            >

                <div class="icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M22 16.92v3a2 2 0 0 1-2.18 2
                               19.79 19.79 0 0 1-8.63-3.07
                               19.5 19.5 0 0 1-6-6
                               19.79 19.79 0 0 1-3.07-8.67
                               A2 2 0 0 1 4.11 2h3
                               a2 2 0 0 1 2 1.72
                               12.84 12.84 0 0 0 .7 2.81
                               2 2 0 0 1-.45 2.11L8.09 9.91
                               a16 16 0 0 0 6 6l1.27-1.27
                               a2 2 0 0 1 2.11-.45
                               12.84 12.84 0 0 0 2.81.7
                               A2 2 0 0 1 22 16.92z"
                        />

                    </svg>

                </div>


                <div class="action-text">

                    <span class="action-label">
                        Phone
                    </span>

                    <span class="action-value">
                        +370 600 00000
                    </span>

                </div>

            </a>



            <!-- =================================================
                 WEBSITE
            ================================================== -->

            <a
                class="action"
                href="https://www.esperanzaresort.lt"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="10"
                        />

                        <line
                            x1="2"
                            y1="12"
                            x2="22"
                            y2="12"
                        />

                        <path
                            d="M12 2a15.3 15.3 0 0 1 4 10
                               15.3 15.3 0 0 1-4 10
                               15.3 15.3 0 0 1-4-10
                               15.3 15.3 0 0 1 4-10z"
                        />

                    </svg>

                </div>


                <div class="action-text">

                    <span class="action-label">
                        Website
                    </span>

                    <span class="action-value">
                        www.esperanzaresort.lt
                    </span>

                </div>

            </a>



            <!-- =================================================
                 LOCATION
            ================================================== -->

            <a
                class="action"
                href="https://maps.google.com/?q=Esperanza+Lake+Resort"
                target="_blank"
                rel="noopener noreferrer"
            >

                <div class="icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M20 10c0 5-8 12-8 12
                               S4 15 4 10a8 8 0 1 1 16 0z"
                        />

                        <circle
                            cx="12"
                            cy="10"
                            r="2.5"
                        />

                    </svg>

                </div>


                <div class="action-text">

                    <span class="action-label">
                        Location
                    </span>

                    <span class="action-value">
                        Esperanza Lake Resort
                    </span>

                </div>

            </a>


        </div>



        <!-- =================================================
             SHARE CONTACT
        ================================================== -->

        <button
            type="button"
            class="share-button"
            onclick="shareContact()"
        >

            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >

                <circle
                    cx="18"
                    cy="5"
                    r="3"
                />

                <circle
                    cx="6"
                    cy="12"
                    r="3"
                />

                <circle
                    cx="18"
                    cy="19"
                    r="3"
                />

                <line
                    x1="8.59"
                    y1="13.51"
                    x2="15.42"
                    y2="17.49"
                />

                <line
                    x1="15.41"
                    y1="6.51"
                    x2="8.59"
                    y2="10.49"
                />

            </svg>

            Share Contact

        </button>



        <!-- =================================================
             QR BUTTON
        ================================================== -->

        <div class="qr-button-wrapper">

            <button
                type="button"
                class="qr-button"
                onclick="openQR()"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <rect
                        x="3"
                        y="3"
                        width="6"
                        height="6"
                        rx="1"
                    />

                    <rect
                        x="15"
                        y="3"
                        width="6"
                        height="6"
                        rx="1"
                    />

                    <rect
                        x="3"
                        y="15"
                        width="6"
                        height="6"
                        rx="1"
                    />

                    <path
                        d="M15 15h3v3h-3z"
                    />

                    <path
                        d="M18 18h3v3h-3z"
                    />

                    <path
                        d="M21 15h-3"
                    />

                    <path
                        d="M15 21h3"
                    />

                </svg>

                Show QR Code

            </button>

        </div>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <div class="footer">

            Esperanza Hospitality Group

        </div>


    </div>



    <!-- =====================================================
         QR MODAL
    ===================================================== -->

    <div
        id="qrModal"
        class="qr-modal"
        onclick="closeQR(event)"
    >

        <div
            class="qr-modal-content"
            onclick="event.stopPropagation()"
        >


            <button
                type="button"
                class="qr-close"
                onclick="closeQR()"
            >

                ×

            </button>


            <div class="qr-modal-title">

                Scan QR Code

            </div>


            <div class="qr-modal-subtitle">

                Scan this QR code with your phone
                to open the digital business card.

            </div>


            <!-- YOUR QR CODE -->

            <img
                src="./qr1.jpg"
                class="qr-image"
                alt="Digital Business Card QR Code"
            >


        </div>

    </div>



    <script>


        /* =====================================================
           SHARE CONTACT
        ===================================================== */

        async function shareContact() {


            const shareData = {

                title:
                    "Aleksandar Simanovic",

                text:
                    "Aleksandar Simanovic - Guest Relations, Esperanza Lake Resort",

                url:
                    window.location.href

            };


            /*
             * Native phone sharing
             */

            if (
                navigator.share
            ) {

                try {

                    await navigator.share(
                        shareData
                    );

                }

                catch (error) {

                    /*
                     * User pressed Cancel.
                     * No message needed.
                     */

                    if (
                        error.name !==
                        "AbortError"
                    ) {

                        console.error(
                            "Share failed:",
                            error
                        );

                    }

                }

            }

            else {

                /*
                 * Fallback for browsers
                 * without native sharing.
                 */

                try {

                    await navigator.clipboard.writeText(
                        window.location.href
                    );


                    alert(
                        "Link copied to clipboard."
                    );

                }

                catch (error) {

                    alert(
                        "Please copy the page link manually."
                    );

                }

            }

        }



        /* =====================================================
           OPEN QR CODE
        ===================================================== */

        function openQR() {

            const modal =
                document.getElementById(
                    "qrModal"
                );


            modal.classList.add(
                "active"
            );


            document.body.style.overflow =
                "hidden";

        }



        /* =====================================================
           CLOSE QR CODE
        ===================================================== */

        function closeQR(event) {


            if (
                event &&
                event.target !==
                event.currentTarget
            ) {

                return;

            }


            const modal =
                document.getElementById(
                    "qrModal"
                );


            modal.classList.remove(
                "active"
            );


            document.body.style.overflow =
                "";

        }



        /* =====================================================
           ESC KEY
        ===================================================== */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.key ===
                    "Escape"
                ) {

                    closeQR();

                }

            }
        );


    </script>


</body>

</html>
