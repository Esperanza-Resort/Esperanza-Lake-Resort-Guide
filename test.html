<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Esperanza Lake Resort</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600&display=swap');
    
    body {
      margin: 0;
      font-family: 'Montserrat', sans-serif;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                  url('esperanzabackround.jpg') no-repeat center center fixed;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    
    .mobile-mode {
      background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                  url('backgroundmobile.jpg') no-repeat center center fixed;
      background-size: cover;
    }
    
    header {
      margin-top: 60px;
      background: linear-gradient(135deg, rgba(25,15,10,0.85), rgba(50,30,20,0.7));
      backdrop-filter: blur(14px) saturate(180%);
      -webkit-backdrop-filter: blur(14px) saturate(180%);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 22px 100px;
      border-radius: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
      text-align: center;
      opacity: 0;
      transform: translateY(-50px);
    }
    
    header img {
      max-width: 300px;
      height: auto;
      opacity: 0;
      transform: scale(0.8);
    }
    
    .menu {
      margin-top: 50px;
      width: 85%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .pdf-item {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border-radius: 14px;
      padding: 14px 20px;
      border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      color: #fff;
      font-weight: 600;
      font-size: 1.1rem;
      letter-spacing: 0.5px;
      text-align: center;
      text-decoration: none;
      position: relative;
      overflow: hidden;
      user-select: none;
    }
    
    .pdf-item::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -10px;
      right: -10px;
      bottom: -10px;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(15px) saturate(160%);
      -webkit-backdrop-filter: blur(15px) saturate(160%);
      z-index: -1;
      pointer-events: none;
      border-radius: 20px;
      transition: background 0.25s ease;
    }
    
    .pdf-item:active {
      transform: scale(0.97);
    }
    
    .pdf-item:hover {
      transform: scale(1.02) translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    
    .pdf-item:hover::before {
      background: rgba(255,255,255,0.22);
    }
    
    /* BACK mygtukas */
    .back-btn {
      align-self: flex-start;
      background: rgba(255,255,255,0.18);
      border: 1px solid rgba(255,255,255,0.3);
      color: #fff;
      font-size: 0.9rem;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      user-select: none;
      margin-bottom: 6px;
      display: inline-flex;
      align-items: center;
    }
    
    .back-btn:active {
      background: rgba(255,255,255,0.35);
    }
    
    /* Modal */
    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    
    #pdf-modal {
      width: 96%;
      max-width: 950px;
      height: 92vh;
      background: linear-gradient(135deg, rgba(30,20,10,0.9), rgba(50,30,20,0.8));
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,0.18);
    }
    
    #pdf-title {
      background: rgba(255,255,255,0.1);
      color: #fff;
      padding: 14px 20px;
      font-size: 1.15rem;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    
    #pdf-viewer {
      width: 100%;
      height: calc(100% - 52px);
      border: none;
    }
    
    #close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: rgba(255,255,255,0.18);
      color: #fff;
      border: none;
      font-size: 1.3rem;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      cursor: pointer;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* Mobile */
    @media (max-width: 600px) {
      header {
        margin-top: 28px;
        width: 88%;
        max-width: 320px;
        padding: 14px 18px;
      }
      header img {
        max-width: 210px;
      }
      .menu {
        margin-top: 36px;
        width: 90%;
      }
      .pdf-item {
        font-size: 1.05rem;
        padding: 13px 18px;
      }
      .back-btn {
        font-size: 0.85rem;
        padding: 7px 14px;
      }
      #pdf-modal {
        width: 100%;
        height: 100%;
        border-radius: 0;
      }
    }
    
    @keyframes fadeInBackground {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes slideInFromTop {
      from { opacity: 0; transform: translateY(-50px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInFromLeft {
      from { opacity: 0; transform: translateX(-30px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>

  <header>
    <img src="logo2.png" alt="">
  </header>

  <!-- PAGRINDINIS MENIU -->
  <div class="menu" id="main-menu">
    <a class="pdf-item" id="video-btn" href="https://drive.google.com/file/d/1ns_RlMJBPm42vLiaO4C4xmVgX1BQUh7j/view?usp=sharing">
      VIDEO
    </a>

    <a class="pdf-item" href="Brochure.pdf" onclick="openPDF(event, 'Brochure.pdf', 'BROCHURE')">
      PDF
    </a>

    <a class="pdf-item" href="#" id="weddings-btn">
      WEDDINGS
    </a>
  </div>

  <!-- WEDDINGS SUBMENU -->
  <div class="menu" id="weddings-menu" style="display: none;">
    <div class="back-btn" id="back-btn">← BACK</div>

    <a class="pdf-item" id="wedding-video-btn" href="https://drive.google.com/file/d/XXXXXXXXXXXXXXXXXXXX/view?usp=sharing">
      WEDDING VIDEO
    </a>

    <a class="pdf-item" href="Weddings.pdf" onclick="openPDF(event, 'Weddings.pdf', 'WEDDINGS')">
      WEDDING PDF
    </a>
  </div>

  <!-- PDF Modal -->
  <div id="overlay">
    <div id="pdf-modal">
      <div id="pdf-title"></div>
      <button id="close-btn" onclick="closePDF()">✖</button>
      <div id="pdf-viewer"></div>
    </div>
  </div>

  <script>
    const mainMenu = document.getElementById('main-menu');
    const weddingsMenu = document.getElementById('weddings-menu');
    const weddingsBtn = document.getElementById('weddings-btn');
    const backBtn = document.getElementById('back-btn');
    const videoBtn = document.getElementById('video-btn');
    const weddingVideoBtn = document.getElementById('wedding-video-btn');
    const overlay = document.getElementById('overlay');
    const viewer = document.getElementById('pdf-viewer');
    const pdfTitle = document.getElementById('pdf-title');
    const pdfModal = document.getElementById('pdf-modal');

    function isMobile() {
      return window.innerWidth <= 600;
    }

    // Rodyti Weddings meniu
    weddingsBtn.addEventListener('click', function(e) {
      e.preventDefault();
      mainMenu.style.display = 'none';
      weddingsMenu.style.display = 'flex';
    });

    // Grįžti atgal
    backBtn.addEventListener('click', function() {
      weddingsMenu.style.display = 'none';
      mainMenu.style.display = 'flex';
    });

    // VIDEO atidarymas
    videoBtn.addEventListener('click', function(e) {
      if (!isMobile()) {
        e.preventDefault();
        window.open(this.href, '_blank');
      }
    });

    // WEDDING VIDEO atidarymas
    weddingVideoBtn.addEventListener('click', function(e) {
      if (!isMobile()) {
        e.preventDefault();
        window.open(this.href, '_blank');
      }
    });

    function openPDF(event, file, title) {
      if (isMobile()) return; // telefone atsidaro natūraliai
      event.preventDefault();
      overlay.style.display = 'flex';
      document.body.style.overflow = 'hidden';
      viewer.innerHTML = '';
      const iframe = document.createElement('iframe');
      iframe.src = file + '?_=' + Date.now() + '#toolbar=0&navpanes=0&scrollbar=0';
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      viewer.appendChild(iframe);
      pdfTitle.textContent = title;
    }

    function closePDF() {
      overlay.style.display = 'none';
      viewer.innerHTML = '';
      document.body.style.overflow = 'auto';
    }

    overlay.addEventListener('click', function(e) {
      if (e.target === overlay) closePDF();
    });

    // Animacijos užkrovus
    window.addEventListener('load', function() {
      if (window.innerWidth <= 600) {
        document.body.classList.add('mobile-mode');
      }

      document.body.style.animation = 'fadeInBackground 1.4s ease forwards';
      
      setTimeout(() => {
        document.querySelector('header').style.animation = 'slideInFromTop 1.1s ease forwards';
      }, 100);
      
      setTimeout(() => {
        document.querySelector('header img').style.animation = 'zoomIn 1.3s ease forwards';
      }, 400);
      
      setTimeout(() => {
        mainMenu.style.animation = 'fadeInUp 1s ease forwards';
        mainMenu.querySelectorAll('.pdf-item').forEach((item, i) => {
          setTimeout(() => {
            item.style.animation = 'slideInFromLeft 0.6s ease forwards';
          }, i * 100);
        });
      }, 700);
    });
  </script>
</body>
</html>
